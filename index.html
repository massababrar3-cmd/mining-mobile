<!doctype html>
<html lang="en">
<head>

<meta name="theme-color" content="#101627">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>BRAVUS — Mobile Operations</title>
<style>
* {
  box-sizing: border-box;
}
html {
  background: #f5f6f8;
  color: #172033;
  font:
    16px/1.5 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}
body {
  margin: 0;
}
header {
  background: #101627;
  color: white;
  display: flex;
  align-items: center;
  gap: 20px;

}
header img {
  width: 138px;
  max-width: 35vw;
}
header span {
  font-weight: 650;
  line-height: 1.3;
}
small {
  display: block;
  font-size: 12px;
  font-weight: 400;
  opacity: 0.8;
  margin-top: 5px;
}
.privacy {
  background: #ddf0e8;
  padding: 10px 16px;
  font-size: 12px;
  color: #185442;
  text-align: center;
}
main {
  max-width: 780px;
  margin: auto;
  padding: 22px 16px 36px;
}
h1 {
  font-size: 29px;
  line-height: 1.2;
  margin: 0 0 10px;
}
h2 {
  font-size: 21px;
  margin: 0 0 10px;
}
h3 {
  font-size: 17px;
  margin: 0 0 8px;
}
p {
  margin: 8px 0 16px;
}
.muted {
  color: #657086;
  font-size: 14px;
}
.panel,
.question {
  background: white;
  border: 1px solid #dce1e9;
  border-radius: 12px;
  padding: 18px;
  margin: 16px 0;
  overflow-wrap: anywhere;
}
label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin: 12px 0;
}
input,
select,
textarea {
  display: block;
  width: 100%;
  font: inherit;
  font-size: 16px;
  color: inherit;
  border: 1px solid #aeb8c8;
  border-radius: 7px;
  padding: 11px;
  margin-top: 6px;
  background: white;
  min-height: 46px;
}
textarea {
  min-height: 115px;
  resize: vertical;
}
input[type="checkbox"] {
  display: inline;
  width: 22px;
  min-height: 22px;
  vertical-align: middle;
  margin: 0 8px 0 0;
}
input[type="file"] {
  font-size: 14px;
}
button,
.button {
  font: inherit;
  font-weight: 600;
  background: #85cdb6;
  color: #102c24;
  border: 0;
  border-radius: 7px;
  padding: 12px 16px;
  min-height: 46px;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  text-align: center;
}
button.secondary,
.button.secondary {
  background: #e9edf3;
  color: #243047;
}
button.danger {
  background: #fbe5e5;
  color: #922d2d;
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 12px 0;
}
.buttons > * {
  flex: 1 1 180px;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.photos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}
.photo {
  border: 1px solid #e0e5ec;
  border-radius: 8px;
  padding: 10px;
  margin: 12px 0;
}
.photo img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border-radius: 5px;
}
.photo label {
  font-size: 12px;
}
.photo input {
  padding: 7px;
}
.hint {
  font-size: 13px;
  color: #61708a;
}
.warn {
  padding: 12px;
  background: #fff4d8;
  border-radius: 7px;
  color: #634b11;
  font-size: 14px;
}
.tag {
  font-size: 12px;
  background: #e5f4ed;
  padding: 5px 9px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 12px;
}
#notice {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 14px 18px;
  background: #e3f3eb;
  border-bottom: 1px solid #8cc3ab;
  font-size: 14px;
}
#notice.error {
  background: #fbe8e8;
  border-color: #c16b6b;
  color: #852a2a;
}
footer {
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  text-align: center;
  color: #67758b;
  font-size: 12px;
  border-top: 1px solid #dde3eb;
}
details {
  margin: 14px 0;
}
summary {
  cursor: pointer;
  font-weight: 600;
}
.hidden,
[hidden] {
  display: none !important;
}
.mono {
  font-family: ui-monospace, monospace;
  font-size: 13px;
}
.step {
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #61708a;
  margin-bottom: 10px;
}
a {
  color: #195f50;
  overflow-wrap: anywhere;
}
input:focus,
textarea:focus,
select:focus,
button:focus-visible,
a:focus-visible {
  outline: 3px solid #369d82;
  outline-offset: 2px;
}
@media (max-width: 450px) {
  .grid {
    grid-template-columns: 1fr;
  }
  .buttons > * {
    flex-basis: 100%;
  }
  main {
    padding: 20px 12px;
  }
  .panel,
  .question {
    padding: 16px;
  }
  header {
    gap: 14px;
  }
  h1 {
    font-size: 26px;
  }
}

</style>

<script>
"use strict";
/* Mine Operations browser PDF export. No network, external fonts or print dialog.
   Western text remains selectable. Other scripts are drawn with Chrome's installed
   fonts and embedded as images so they are not encoded as broken PDF characters.
   Those text runs are visually preserved but are not selectable/searchable. */
(() => {
  const PAGE_WIDTH = 595.28,
    PAGE_HEIGHT = 841.89;
  const MARGIN = 42,
    CONTENT_WIDTH = PAGE_WIDTH - MARGIN * 2;
  const TOP = 110,
    BOTTOM = 790,
    MAX_PAGES = 300;
  const encoder = new TextEncoder();
  const extended = new Map([
    [0x20ac, 128],
    [0x201a, 130],
    [0x0192, 131],
    [0x201e, 132],
    [0x2026, 133],
    [0x2020, 134],
    [0x2021, 135],
    [0x02c6, 136],
    [0x2030, 137],
    [0x0160, 138],
    [0x2039, 139],
    [0x0152, 140],
    [0x017d, 142],
    [0x2018, 145],
    [0x2019, 146],
    [0x201c, 147],
    [0x201d, 148],
    [0x2022, 149],
    [0x2013, 150],
    [0x2014, 151],
    [0x02dc, 152],
    [0x2122, 153],
    [0x0161, 154],
    [0x203a, 155],
    [0x0153, 156],
    [0x017e, 158],
    [0x0178, 159],
  ]);
  const ascii = (value) => encoder.encode(value);
  const number = (value) => Number(value).toFixed(2);
  const label = (value) => String(value ?? "").replaceAll("_", " ");
  const clean = (value) =>
    String(value ?? "—")
      .replace(/\r\n?/g, "\n")
      .replace(/\t/g, "    ")
      .replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, " ");
  function western(value) {
    return [...value].every((char) => {
      const n = char.codePointAt(0);
      return (n >= 32 && n <= 126) || (n >= 160 && n <= 255) || extended.has(n);
    });
  }
  function literal(value) {
    return (
      "(" +
      [...value]
        .map((char) => {
          const n = char.codePointAt(0),
            byte = extended.get(n) ?? n;
          if (byte > 255) throw new Error("Unsupported PDF text encoding.");
          if (char === "(" || char === ")" || char === "\\") return "\\" + char;
          return byte >= 32 && byte < 127
            ? char
            : "\\" + byte.toString(8).padStart(3, "0");
        })
        .join("") +
      ")"
    );
  }
  function metadata(value) {
    const bytes = [254, 255];
    for (let i = 0; i < value.length; i++)
      bytes.push(value.charCodeAt(i) >> 8, value.charCodeAt(i) & 255);
    return (
      "<" + bytes.map((b) => b.toString(16).padStart(2, "0")).join("") + ">"
    );
  }
  function join(parts) {
    const result = new Uint8Array(
      parts.reduce((sum, part) => sum + part.length, 0),
    );
    let offset = 0;
    for (const part of parts) {
      result.set(part, offset);
      offset += part.length;
    }
    return result;
  }
  function bytesFromDataURL(url) {
    const data = atob(url.slice(url.indexOf(",") + 1));
    return Uint8Array.from(data, (char) => char.charCodeAt(0));
  }
  async function readableImage(
    data,
    name = "Photograph",
    background = "white",
  ) {
    if (
      typeof data !== "string" ||
      !/^data:image\/(png|jpeg|webp);base64,/i.test(data)
    )
      throw new Error(name + " is not an embedded JPEG, PNG or WebP image.");
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = () =>
        reject(
          new Error(name + " could not be decoded. PDF was not exported."),
        );
      img.src = data;
    });
    if (
      !img.naturalWidth ||
      !img.naturalHeight ||
      img.naturalWidth * img.naturalHeight > 50000000
    )
      throw new Error(
        name + " has invalid dimensions or exceeds 50 megapixels.",
      );
    const factor = Math.min(
      1,
      1800 / Math.max(img.naturalWidth, img.naturalHeight),
    );
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * factor));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * factor));
    const ctx = canvas.getContext("2d");
    if (!ctx)
      throw new Error("Chrome canvas is unavailable for PDF photographs.");
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const result = {
      width: canvas.width,
      height: canvas.height,
      bytes: bytesFromDataURL(canvas.toDataURL("image/jpeg", 0.9)),
    };
    canvas.width = canvas.height = 1;
    return result;
  }
  function conditional(question, answers, questions, seen = new Set()) {
    if (!question.condition) return true;
    if (seen.has(question.id)) return false;
    const parent = questions.find((q) => q.id === question.condition.question);
    return (
      (!parent ||
        conditional(
          parent,
          answers,
          questions,
          new Set([...seen, question.id]),
        )) &&
      String(answers[question.condition.question] ?? "") ===
        question.condition.equals
    );
  }
  function answer(value) {
    if (value == null || value === "") return "No response recorded";
    if (typeof value === "object") return JSON.stringify(value, null, 2);
    return String(value);
  }
  function filename(record) {
    const reference = String(record.reference || record.id || "record")
      .replace(/[^a-zA-Z0-9._-]/g, "-")
      .replace(/-+/g, "-")
      .slice(0, 100);
    const kind = record.kind || record.snapshot?.kind || "record";
    return (
      (kind === "handover"
        ? "Handover-"
        : kind === "inspection"
          ? "Inspection-"
          : "Record-") +
      reference +
      "-v" +
      Math.max(0, Number(record.submissionVersion) || 0) +
      ".pdf"
    );
  }
  async function createRecordPDF(record, options = {}) {
    if (
      !record ||
      !record.snapshot ||
      !Array.isArray(record.snapshot.questions)
    )
      throw new Error(
        "A saved record and its form version are required for PDF export.",
      );
    if ((record.photos?.length || 0) > 100)
      throw new Error(
        "PDF export supports at most 100 photographs per record.",
      );
    const timeZone = options.timeZone || "Australia/Brisbane";
    let formatter;
    try {
      formatter = new Intl.DateTimeFormat("en-AU", {
        timeZone,
        dateStyle: "medium",
        timeStyle: "short",
      });
    } catch {
      throw new Error("The configured PDF time zone is invalid.");
    }
    const date = (value) =>
      value && !Number.isNaN(new Date(value).getTime())
        ? formatter.format(new Date(value)) + " (" + timeZone + ")"
        : "Not recorded";
    const name = (id) =>
      id
        ? typeof options.profileName === "function"
          ? options.profileName(id)
          : "Profile " + id
        : "Not assigned";
    const company = clean(options.companyName || "BRAVUS");
    const site = clean(options.siteName || "Mine Operations Hub");
    const kind = label(
      record.kind || record.snapshot.kind || "Operational record",
    );
    const objects = [
      null,
      null,
      null,
      ascii(
        "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      ),
      ascii(
        "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
      ),
      ascii(
        "<< /Title " +
          metadata(kind + " " + (record.reference || "")) +
          " /Author " +
          metadata(clean(record.authorName || "Local profile")) +
          " /Creator " +
          metadata("Mine Operations Hub — Browser Edition") +
          " >>",
      ),
    ];
    const reserve = () => {
      objects.push(null);
      return objects.length - 1;
    };
    const imageCache = new Map();
    const pages = [];
    let page,
      cursor = TOP,
      unicodeUsed = false;
    const measureCanvas = document.createElement("canvas"),
      measure = measureCanvas.getContext("2d");
    if (!measure)
      throw new Error("Chrome canvas is unavailable for PDF text layout.");
    function newPage() {
      if (pages.length >= MAX_PAGES)
        throw new Error(
          "PDF exceeds 300 pages. Shorten this record before exporting.",
        );
      page = { content: [], images: new Map() };
      pages.push(page);
      cursor = TOP;
    }
    function ensure(height) {
      if (cursor + height > BOTTOM) newPage();
    }
    function rectangle(x, top, width, height, color) {
      page.content.push(
        color +
          " rg " +
          number(x) +
          " " +
          number(PAGE_HEIGHT - top - height) +
          " " +
          number(width) +
          " " +
          number(height) +
          " re f\n",
      );
    }
    function addImage(image) {
      if (image.object) return image.object;
      const id = reserve();
      objects[id] = join([
        ascii(
          "<< /Type /XObject /Subtype /Image /Width " +
            image.width +
            " /Height " +
            image.height +
            " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " +
            image.bytes.length +
            " >>\nstream\n",
        ),
        image.bytes,
        ascii("\nendstream"),
      ]);
      image.object = id;
      return id;
    }
    function drawImage(image, x, top, width, height) {
      const id = addImage(image),
        resource = "Im" + id;
      page.images.set(resource, id);
      page.content.push(
        "q " +
          number(width) +
          " 0 0 " +
          number(height) +
          " " +
          number(x) +
          " " +
          number(PAGE_HEIGHT - top - height) +
          " cm /" +
          resource +
          " Do Q\n",
      );
    }
    function drawLine(
      value,
      x,
      top,
      size,
      bold = false,
      color = "0.1 0.13 0.2",
      width = CONTENT_WIDTH,
    ) {
      value = clean(value);
      if (!value) return;
      if (western(value)) {
        page.content.push(
          "BT /" +
            (bold ? "FB" : "FR") +
            " " +
            size +
            " Tf " +
            color +
            " rg 1 0 0 1 " +
            number(x) +
            " " +
            number(PAGE_HEIGHT - top - size) +
            " Tm " +
            literal(value) +
            " Tj ET\n",
        );
      } else {
        unicodeUsed = true;
        const canvas = document.createElement("canvas"),
          factor = 3;
        canvas.width = Math.max(1, Math.ceil(width * factor));
        canvas.height = Math.ceil(size * 1.8 * factor);
        const ctx = canvas.getContext("2d");
        ctx.scale(factor, factor);
        ctx.fillStyle = color === "1 1 1" ? "#0e1424" : "white";
        ctx.fillRect(0, 0, width, size * 1.8);
        ctx.font = (bold ? "bold " : "") + size + "px Arial, sans-serif";
        ctx.fillStyle =
          "rgb(" +
          color
            .split(" ")
            .map((n) => Math.round(Number(n) * 255))
            .join(",") +
          ")";
        ctx.textBaseline = "top";
        const rtl = /^[\s\d\p{P}]*[\u0590-\u08ff]/u.test(value);
        ctx.direction = rtl ? "rtl" : "ltr";
        ctx.textAlign = rtl ? "right" : "left";
        ctx.fillText(value, rtl ? width : 0, 0);
        const image = {
          width: canvas.width,
          height: canvas.height,
          bytes: bytesFromDataURL(canvas.toDataURL("image/jpeg", 0.95)),
        };
        drawImage(image, x, top, width, size * 1.8);
        canvas.width = canvas.height = 1;
      }
    }
    function lines(value, size, bold = false, width = CONTENT_WIDTH) {
      measure.font = (bold ? "bold " : "") + size + "px Arial, sans-serif";
      const result = [];
      for (const paragraph of clean(value).split("\n")) {
        if (!paragraph) {
          result.push("");
          continue;
        }
        let current = "";
        for (const word of paragraph.split(/(\s+)/)) {
          if (measure.measureText(current + word).width <= width) {
            current += word;
            continue;
          }
          if (current.trim()) result.push(current.trimEnd());
          current = "";
          // Split long URLs, equipment IDs and text without spaces by grapheme.
          const chars =
            typeof Intl.Segmenter === "function"
              ? [
                  ...new Intl.Segmenter(undefined, {
                    granularity: "grapheme",
                  }).segment(word),
                ].map((s) => s.segment)
              : [...word];
          for (const char of chars) {
            if (current && measure.measureText(current + char).width > width) {
              result.push(current);
              current = "";
            }
            current += char;
          }
        }
        if (current.trim()) result.push(current.trimEnd());
      }
      return result.length ? result : [""];
    }
    function text(
      value,
      {
        size = 10,
        bold = false,
        color = "0.1 0.13 0.2",
        gap = 5,
        indent = 0,
      } = {},
    ) {
      const height = Math.max(size * 1.9, 17);
      for (const line of lines(value, size, bold, CONTENT_WIDTH - indent)) {
        ensure(height);
        drawLine(
          line,
          MARGIN + indent,
          cursor,
          size,
          bold,
          color,
          CONTENT_WIDTH - indent,
        );
        cursor += height;
      }
      cursor += gap;
    }
    function section(title) {
      ensure(48);
      cursor += 8;
      rectangle(MARGIN, cursor, CONTENT_WIDTH, 24, "0.9 0.96 0.94");
      drawLine(
        title,
        MARGIN + 10,
        cursor + 5,
        11,
        true,
        "0.06 0.32 0.28",
        CONTENT_WIDTH - 20,
      );
      cursor += 34;
    }
    function field(key, value) {
      text(key + ": " + clean(value), { size: 10, gap: 1 });
    }
    async function photograph(photo, index, prefix = "Photo") {
      const data = photo.data || photo.dataUrl;
      let image = imageCache.get(data);

  async function generate() {
    if (busy) throw new Error("Wait for photo processing to finish.");
    for (const question of record.snapshot.questions) {
      if (!visible(question)) continue;
      const value = record.answers[question.id];
      if (
        question.required &&
        (value == null ||
          String(value).trim() === "" ||
          (question.type === "checkbox" && !value))
      )
        throw new Error("Complete required question: " + question.label);
      if (
        question.photoMode === "required" &&
        !record.photos.some((p) => p.questionId === question.id)
      )
        throw new Error("Add a photograph for: " + question.label);
    }
    for (const a of record.actions) {
      required(a.description, "Corrective action description", 4000);
      required(a.assigneeName, "Corrective action assignee");
      if (!a.dueAt)
        throw new Error("Add a due date for each corrective action.");
    }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(record.date))
      throw new Error("Choose an operational date.");
    const mark = epoch;
    busy = true;
    notice("Generating your PDF on this device…");
    try {
      const done = clone(record);
      done.status = "completed_on_device";
      done.submittedAt = new Date().toISOString();
      done.submissionVersion = 1;
      done.photos = done.photos.filter(
        (p) =>
          !p.questionId ||
          done.snapshot.questions.some(
            (q) => q.id === p.questionId && visible(q),
          ),
      );
      const blob = await window.MinePDF.createRecordPDF(done, {
        companyName: settings.companyName,
        siteName: settings.siteName,
        timeZone: settings.timeZone,
        actions: done.actions,
        submissionLabel: "Completed on device",
        profileName: (name) => name,
        actionDateOnly: true,
      });
      if (mark !== epoch) return;
      const person = done.authorName
        .normalize("NFKC")
        .replace(/[^\p{L}\p{N}_-]+/gu, "_")
        .slice(0, 60);
      const filename =
        window.MinePDF.filename(done).replace(/\.pdf$/, "-") +
        person +
        "-" +
        dateName() +
        ".pdf";
      prepared = { blob, filename, record: done };
      delivery();
      notice("PDF ready. This has not sent email or uploaded to SharePoint.");
    } finally {
      if (mark === epoch) busy = false;
    }
  }

  function validateConfig(value) {
    if (
      !value ||
      value.format !== "mine-mobile-templates-v1" ||
      !value.settings ||
      !Array.isArray(value.templates) ||
      !value.templates.length ||
      value.templates.length > 30
    )
      throw new Error(
        "Choose a mobile template/config file. Workspace/report backups are not accepted.",
      );
    const s = value.settings;
    const out = {
      companyName: required(s.companyName, "Company", 100),
      siteName: required(s.siteName, "Site", 100),
      timeZone: required(s.timeZone, "Timezone", 100),
      handoverEmail: required(s.handoverEmail, "Handover email", 254),
      inspectionEmail: required(s.inspectionEmail, "Inspection email", 254),
      sharepointUrl: s.sharepointUrl ? sharepointURL(s.sharepointUrl) : "",
      areas: s.areas,
      shifts: s.shifts,
    };
    new Intl.DateTimeFormat("en", { timeZone: out.timeZone });
    for (const address of [out.handoverEmail, out.inspectionEmail])
      if (!/^[^\s<>@,;]+@[^\s<>@,;]+\.[^\s<>@,;]+$/.test(address))
        throw new Error("Enter valid recipient email addresses.");
    if (
      !Array.isArray(out.areas) ||
      !out.areas.length ||
      out.areas.length > 100
    )
      throw new Error("Configure between 1 and 100 areas.");
    out.areas = out.areas.map((x) => required(x, "Area", 100));
    if (
      !Array.isArray(out.shifts) ||
      !out.shifts.length ||
      out.shifts.length > 20
    )
      throw new Error("Configure between 1 and 20 shifts.");
    out.shifts = out.shifts.map((s) => {
      const item = {
        name: required(s.name, "Shift name", 100),
        start: s.start,
        end: s.end,
        deadline: s.deadline,
      };
      for (const key of ["start", "end", "deadline"])
        if (!/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(item[key]))
          throw new Error("Shift times/deadline must be HH:MM.");
      return item;
    });
    const ts = value.templates.map((t) => {
      if (
        !["handover", "inspection"].includes(t.kind) ||
        !Array.isArray(t.questions) ||
        !t.questions.length ||
        t.questions.length > 100
      )
        throw new Error("Each form needs a kind and 1–100 questions.");
      const ids = new Set();
      const questions = t.questions.map((q) => {
        if (
          ![
            "text",
            "textarea",
            "select",
            "number",
            "date",
            "checkbox",
          ].includes(q.type) ||
          !["none", "optional", "required"].includes(q.photoMode)
        )
          throw new Error("Invalid question type or picture rule.");
        const id = required(q.id, "Question ID", 100);
        if (
          !/^[A-Za-z0-9_-]+$/.test(id) ||
          ["__proto__", "constructor", "prototype"].includes(id)
        )
          throw new Error("Use safe, unique question identifiers.");
        if (ids.has(id)) throw new Error("Question IDs must be unique.");
        ids.add(id);
        const options =
          q.type === "select"
            ? (q.options || []).map((x) => required(x, "Option", 200))
            : [];
        if (q.type === "select" && (!options.length || options.length > 100))
          throw new Error("Select questions need 1–100 options.");
        const condition = q.condition
          ? {
              question: required(
                q.condition.question,
                "Condition question",
                100,
              ),
              equals: String(q.condition.equals ?? "").slice(0, 200),
            }
          : null;
        if (condition && !ids.has(condition.question))
          throw new Error("Conditions must refer to an earlier question.");
        if (condition?.question === id)
          throw new Error("A question cannot depend on itself.");
        return {
          id,
          label: required(q.label, "Question label", 500),
          type: q.type,
          required: !!q.required,
          photoMode: q.photoMode,
          options,
          condition,
        };
      });
      return {
        id: required(t.id, "Template ID", 100),
        name: required(t.name, "Template name", 100),
        kind: t.kind,
        position: required(t.position, "Position", 100),
        department: required(t.department, "Department", 100),
        version:
          Number.isSafeInteger(t.version) && t.version > 0 ? t.version : 1,
        questions,
      };
    });
    if (new Set(ts.map((t) => t.id)).size !== ts.length)
      throw new Error("Template IDs must be unique.");
    return { format: value.format, settings: out, templates: ts };
  }

              (q.options = e.target.value.split("\n").filter((x) => x.trim())),
          });
          const parent = sel(
            "parent",
            [
              { value: "", label: "Always visible" },
              ...t.questions
                .slice(0, i)
                .map((p) => ({ value: p.id, label: p.label })),
            ],
            q.condition?.question || "",
          );
          const equals = inp("equals", q.condition?.equals || "", "text", {
            maxLength: 200,
          });
          const conditional = () => {
            q.condition = parent.value
              ? { question: parent.value, equals: equals.value }
              : null;
          };
          parent.addEventListener("change", conditional);
          equals.addEventListener("input", conditional);
          block.append(
            field("Question type", type),
            field(
              "Required answer",
              inp("required", "", "checkbox", {
                checked: q.required,
                onchange: (e) => (q.required = e.target.checked),
              }),
            ),
            field("Question pictures", mode),
            field("Select options — one per line", options),
            field("Show only when question", parent),
            field("Condition equals", equals),
            btn(
              "Remove question",
              () => {
                if (t.questions.some((x) => x.condition?.question === q.id))
                  throw new Error("Remove dependent conditions first.");
                t.questions = t.questions.filter((x) => x.id !== q.id);
                draw();
              },
              "danger",
            ),
          );
          return block;
        }),
      );
    }
    draw();
    f.append(
      list,
      btn(
        "Add question",
        () => {
          t.questions.push(q("New question"));
          draw();
        },
        "secondary",
      ),
      n("button", { type: "submit" }, "Keep template changes"),
    );
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      run(() => {
        Object.assign(t, {
          name: f.elements.name.value,
          kind: f.elements.kind.value,
          position: f.elements.position.value,
          department: f.elements.department.value,
        });
        validateConfig(configDraft);
        t.version++;
        configView();
      });
    });
    c.append(f);
  }
  window.addEventListener("pagehide", reset);
  window.addEventListener("pageshow", (e) => {
    if (e.persisted) {
      reset();
      home();
    }
  });
  window.addEventListener("beforeunload", (e) => {
    if (record) {
      e.preventDefault();
      e.returnValue = "";
    }
  });
  home();
})();

</script>
</body>
</html>
